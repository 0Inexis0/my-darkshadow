<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="DarkShadow's Shell">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151515"/>
      <stop offset="0.45" stop-color="#050505"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d8d8d8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d8d8d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9a9a9a" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#9a9a9a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4c4c4"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <clipPath id="card"><rect width="1280" height="420" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#dots)"/>
    <!-- grey and white light -->
    <ellipse cx="170" cy="40" rx="420" ry="230" fill="url(#blobL)"/>
    <ellipse cx="1140" cy="400" rx="460" ry="240" fill="url(#blobR)"/>
    <g filter="url(#soft)" opacity="0.9">
      <rect x="-200" y="120" width="1700" height="34" fill="url(#beam)" transform="rotate(-14 640 210)"/>
      <rect x="-200" y="250" width="1700" height="18" fill="url(#beam)" transform="rotate(-14 640 210)"/>
    </g>
    <rect width="1280" height="420" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <text x="640" y="196" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="84" font-weight="700" letter-spacing="-2.5" fill="url(#title)">DarkShadow's Shell</text>

  <rect x="510" y="232" width="260" height="1" fill="url(#line)"/>

  <text x="640" y="276" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace"
        font-size="17" letter-spacing="5" fill="#a8a8a8">QUICKSHELL  ·  HYPRLAND  ·  WAYBAR</text>

  <text x="640" y="368" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace"
        font-size="13" letter-spacing="3" fill="#6e6e6e">NixOS  ·  Arch Linux</text>
</svg>

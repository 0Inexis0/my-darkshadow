<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Shadow's Shell">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="0.55" stop-color="#14141d"/>
      <stop offset="1" stop-color="#0d0d14"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b7bff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b7bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3fb6ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3fb6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a9a9b8"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.85" stop-color="#0a0a0f" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0a0f" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="420" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="18" fill="url(#dots)"/>
  <ellipse cx="260" cy="90" rx="380" ry="260" fill="url(#g1)"/>
  <ellipse cx="1040" cy="360" rx="420" ry="250" fill="url(#g2)"/>

  <!-- one-island bar mock-up -->
  <g transform="translate(440 34)">
    <rect width="400" height="40" rx="14" fill="#16161d" stroke="#ffffff" stroke-opacity="0.09"/>
    <circle cx="26" cy="20" r="6" fill="#8b7bff"/>
    <g fill="#e8e8ef" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="13">
      <text x="56" y="25" fill-opacity="0.95">1</text>
      <text x="80" y="25" fill-opacity="0.45">2</text>
      <text x="104" y="25" fill-opacity="0.45">3</text>
      <text x="128" y="25" fill-opacity="0.45">4</text>
      <text x="190" y="25" fill-opacity="0.8">Now playing</text>
      <text x="318" y="25" fill-opacity="0.8">22:38</text>
    </g>
    <circle cx="372" cy="20" r="4" fill="#ffffff" fill-opacity="0.55"/>
  </g>

  <text x="640" y="212" text-anchor="middle" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="92" font-weight="800" letter-spacing="-2" fill="url(#title)">Shadow's Shell</text>
  <text x="640" y="262" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace"
        font-size="20" letter-spacing="3" fill="#9a9aae">HYPRLAND  ·  QUICKSHELL  ·  WAYBAR</text>

  <g font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#c9c9d6" text-anchor="middle">
    <rect x="428" y="306" width="132" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="494" y="328">NixOS</text>
    <rect x="574" y="306" width="132" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="640" y="328">Arch Linux</text>
    <rect x="720" y="306" width="132" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="786" y="328">SUPER + U</text>
  </g>
  <rect width="1280" height="420" rx="18" fill="url(#fade)"/>
</svg>

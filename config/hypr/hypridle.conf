# Generated by rice-lock (Settings > Idle & Lockscreen). 0 minutes = never.

general {
    lock_cmd = @HOME@/.local/bin/rice-lock now
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = @HOME@/.local/bin/rice-lock screen on
}

# lock
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# screen off
listener {
    timeout = 900
    on-timeout = @HOME@/.local/bin/rice-lock screen off
    on-resume = @HOME@/.local/bin/rice-lock screen on
}

# sleep
listener {
    timeout = 3600
    on-timeout = $HOME/.local/bin/rice-sys suspend
}

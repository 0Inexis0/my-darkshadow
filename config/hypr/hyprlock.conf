background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.5
    contrast = 0.9
}

general {
    hide_cursor = false
}

# Time
label {
    monitor =
    text = cmd[update:10000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 0.85)
    font_size = 90
    font_family = Jetbrains Mono
    position = 0, 140
    halign = center
    valign = center
}

# Password
input-field {
    monitor =
    size = 260, 50
    outline_thickness = 0
    rounding = -1
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    inner_color = rgba(255, 255, 255, 0.08)
    font_color = rgb(220, 220, 220)
    check_color = rgba(255, 255, 255, 0.4)
    fail_color = rgba(200, 80, 80, 0.5)
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff66">Password</span>
    font_family = Jetbrains Mono
    position = 0, 20
    halign = center
    valign = center
}

# Log off
label {
    monitor =
    text = <span>󰍃 </span>
    color = rgba(255, 255, 255, 0.6)
    font_size = 36
    font_family = Jetbrains Mono
    onclick = @HOME@/.local/bin/logout
    position = -150, -90
    halign = center
    valign = center
}

# Power off
label {
    monitor =
    text = <span>󰐥 </span>
    color = rgba(255, 255, 255, 0.6)
    font_size = 36
    font_family = Jetbrains Mono
    onclick = systemctl poweroff
    position = -50, -90
    halign = center
    valign = center
}

# Suspend
label {
    monitor =
    text = <span>󰤄 </span>
    color = rgba(255, 255, 255, 0.6)
    font_size = 36
    font_family = Jetbrains Mono
    onclick = systemctl suspend
    position = 50, -90
    halign = center
    valign = center
}

# Reboot
label {
    monitor =
    text = <span>󰜉 </span>
    color = rgba(255, 255, 255, 0.6)
    font_size = 36
    font_family = Jetbrains Mono
    onclick = systemctl reboot
    position = 150, -90
    halign = center
    valign = center
}

source = ~/.config/hypr/rice-lock.conf

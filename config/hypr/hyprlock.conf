# Shadow's Shell lock screen. Generated by rice-lock (Settings > Idle & Lockscreen).

# Turn off 'Manage lock screen' there to keep your own file. (rice-lock.conf is not used)



background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.50
    contrast = 0.9
}

general {
    hide_cursor = false
}

label {
    monitor =
    text = cmd[update:10000] echo "<b>$(date +'%H:%M')</b>"
    color = rgba(255, 255, 255, 0.92)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B'
    color = rgba(255, 255, 255, 0.55)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 66
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] @HOME@/.local/bin/rice-lock greet
    color = rgba(255, 255, 255, 0.90)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = center
}

image {
    monitor =
    path = @HOME@/.face
    size = 96
    rounding = -1
    border_size = 2
    border_color = rgba(212, 212, 212, 0.70)
    position = 0, 310
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 52
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    font_color = rgb(230, 230, 230)
    check_color = rgba(212, 212, 212, 0.60)
    fail_color = rgba(220, 80, 80, 0.6)
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <span foreground="##ffffff77">Enter password</span>
    outline_thickness = 0
    rounding = -1
    inner_color = rgba(255, 255, 255, 0.08)
    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor =
    text = <span>󰍃 </span>
    color = rgba(255, 255, 255, 0.60)
    font_size = 30
    font_family = JetBrainsMono Nerd Font
    onclick = @HOME@/.local/bin/logout
    position = -135, -146
    halign = center
    valign = center
}

label {
    monitor =
    text = <span>󰐥 </span>
    color = rgba(255, 255, 255, 0.60)
    font_size = 30
    font_family = JetBrainsMono Nerd Font
    onclick = systemctl poweroff
    position = -45, -146
    halign = center
    valign = center
}

label {
    monitor =
    text = <span>󰤄 </span>
    color = rgba(255, 255, 255, 0.60)
    font_size = 30
    font_family = JetBrainsMono Nerd Font
    onclick = systemctl suspend
    position = 45, -146
    halign = center
    valign = center
}

label {
    monitor =
    text = <span>󰜉 </span>
    color = rgba(255, 255, 255, 0.60)
    font_size = 30
    font_family = JetBrainsMono Nerd Font
    onclick = systemctl reboot
    position = 135, -146
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3000] @HOME@/.local/bin/rice-lock notif
    color = rgba(255, 255, 255, 0.75)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}

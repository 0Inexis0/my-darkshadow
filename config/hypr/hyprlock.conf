# DarkShadow's Shell lock screen. Generated by rice-lock (Settings > Idle & Lockscreen).

# Turn off 'Manage lock screen' there to keep your own file. (rice-lock.conf is not used)



background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.50
    contrast = 0.9
}

general {
    hide_cursor = false
}

label {
    monitor =
    text = cmd[update:10000] echo "<b>$(date +%H)</b>"
    color = rgba(212, 212, 212, 0.95)
    font_size = 120
    font_family = Bebas Neue
    position = 0, 250
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:10000] echo "$(date +%M)"
    color = rgba(212, 212, 212, 0.55)
    font_size = 120
    font_family = Bebas Neue
    position = 0, 118
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B'
    color = rgba(255, 255, 255, 0.55)
    font_size = 18
    font_family = Google Sans Flex
    position = 0, 30
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] @HOME@/.local/bin/rice-lock greet
    color = rgba(255, 255, 255, 0.90)
    font_size = 15
    font_family = Google Sans Flex
    position = 0, -6
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 52
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    font_color = rgb(230, 230, 230)
    check_color = rgba(212, 212, 212, 0.60)
    fail_color = rgba(220, 80, 80, 0.6)
    fade_on_empty = false
    font_family = Google Sans Flex
    placeholder_text = <span foreground="##ffffff77">Enter password</span>
    outline_thickness = 0
    rounding = 0
    inner_color = rgba(0, 0, 0, 0.0)
    position = 0, -96
    halign = center
    valign = center
}

shape {
    monitor =
    size = 300, 2
    color = rgba(212, 212, 212, 0.80)
    rounding = 0
    border_size = 0
    position = 0, -124
    halign = center
    valign = center
}

label {
    monitor =
    text = <span>󰍃 </span>
    color = rgba(255, 255, 255, 0.60)
    font_size = 30
    font_family = Google Sans Flex
    onclick = @HOME@/.local/bin/logout
    position = -135, -190
    halign = center
    valign = center
}

label {
    monitor =
    text = <span>󰐥 </span>
    color = rgba(255, 255, 255, 0.60)
    font_size = 30
    font_family = Google Sans Flex
    onclick = $HOME/.local/bin/rice-sys poweroff
    position = -45, -190
    halign = center
    valign = center
}

label {
    monitor =
    text = <span>󰤄 </span>
    color = rgba(255, 255, 255, 0.60)
    font_size = 30
    font_family = Google Sans Flex
    onclick = $HOME/.local/bin/rice-sys suspend
    position = 45, -190
    halign = center
    valign = center
}

label {
    monitor =
    text = <span>󰜉 </span>
    color = rgba(255, 255, 255, 0.60)
    font_size = 30
    font_family = Google Sans Flex
    onclick = $HOME/.local/bin/rice-sys reboot
    position = 135, -190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1500] @HOME@/.local/bin/rice-lock media
    color = rgba(255, 255, 255, 0.75)
    font_size = 14
    font_family = Google Sans Flex
    position = 0, 40
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:3000] @HOME@/.local/bin/rice-sysline
    color = rgba(255, 255, 255, 0.75)
    font_size = 14
    font_family = Google Sans Flex
    position = 0, 72
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:600000] @HOME@/.local/bin/rice-lock weather
    color = rgba(255, 255, 255, 0.75)
    font_size = 14
    font_family = Google Sans Flex
    position = 0, 104
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:3000] @HOME@/.local/bin/rice-lock notif
    color = rgba(255, 255, 255, 0.75)
    font_size = 14
    font_family = Google Sans Flex
    position = 0, 136
    halign = center
    valign = bottom
}

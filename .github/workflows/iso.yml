name: Build installation ISO
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft release tag for the installation preview
        required: true
        default: iso-v1.0.0-preview.1
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || exit 2
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          cp personal/RELEASE-NOTES.md "$RUNNER_TEMP/release-notes.md"
          printf '\nSource commit: %s.\n' "$GITHUB_SHA" >> "$RUNNER_TEMP/release-notes.md"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            [[ "$draft" == true ]] || { echo 'Choose a new tag; published releases are preserved.'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --draft --prerelease --title "my-darkshadow · installation preview" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
  build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        profile: [generic, legion]
    steps:
      - uses: actions/checkout@v4
      - name: Make room for the live image
        run: |
          sudo python3 - <<'PY'
          import shutil
          for path in ['/usr/share/dotnet', '/usr/local/lib/android', '/opt/ghc']:
              shutil.rmtree(path, ignore_errors=True)
          PY
      - uses: cachix/install-nix-action@v31
      - name: Check publication inventory
        run: python3 personal/check-publication.py
      - name: Build ISO
        run: bash personal/build-iso.sh '${{ matrix.profile }}'
      - name: Upload installation files directly to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --clobber

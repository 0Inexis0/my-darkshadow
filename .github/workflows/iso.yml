name: Build installation ISO
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [generic, legion]
    steps:
      - uses: actions/checkout@v4
      - name: Make room for the live image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: cachix/install-nix-action@v31
      - name: Check publication inventory
        run: python3 personal/check-publication.py
      - name: Build ISO
        run: bash personal/build-iso.sh '${{ matrix.profile }}'
      - uses: actions/upload-artifact@v4
        with:
          name: my-darkshadow-${{ matrix.profile }}
          path: dist/release/*
          compression-level: 0
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --generate-notes --repo "$GITHUB_REPOSITORY"

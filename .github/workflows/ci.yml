name: CI
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -x install.sh sync.sh install/lib/*.sh
      - name: Python scripts compile
        run: |
          for f in bin/*; do
            if head -n1 "$f" | grep -q python; then python3 -m py_compile "$f"; fi
          done
      - name: Security checks
        run: |
          bash tests/security.sh
      - name: Infinite Desktop screens
        run: |
          sudo apt-get install -y lua5.4
          mkdir -p "$RUNNER_TEMP/lua"
          ln -s "$(command -v lua5.4)" "$RUNNER_TEMP/lua/lua"
          PATH="$RUNNER_TEMP/lua:$PATH" bash tests/infinite.sh
      - name: Dock
        run: |
          bash tests/dock.sh
      - name: QML syntax
        run: |
          sudo apt-get install -y qt6-declarative-dev-tools
          bash tests/qml-syntax.sh
      - name: Installer dry run
        run: SHADOWS_ALLOW_ROOT=1 ./install.sh --yes --dry-run

name: CI
on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -x install.sh sync.sh install/lib/*.sh personal/*.sh
      - name: Regression and installer tests
        run: |
          python3 -B -m unittest discover -s tests -v
          python3 -B -m unittest discover -s personal/login/tests -p 'test_*.py' -v
          python3 personal/check-publication.py
      - name: Python scripts compile
        run: |
          for f in bin/*; do
            if head -n1 "$f" | grep -q python; then python3 -m py_compile "$f"; fi
          done
      - name: Security checks
        run: |
          bash tests/security.sh
      - name: Installer dry run
        run: SHADOWS_ALLOW_ROOT=1 ./install.sh --yes --dry-run

  login-qml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools qml6-module-qttest qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls qml6-module-qtquick-templates qml6-module-qtqml-workerscript
      - name: Login behavior and display scaling
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: /usr/lib/qt6/bin/qmltestrunner -input personal/login/tests

  nix-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check flake and both hardware profiles
        run: |
          nix flake check --no-build
          nix eval --raw .#nixosConfigurations.live.config.system.build.toplevel.drvPath
          nix eval --raw .#nixosConfigurations.live-legion.config.system.build.toplevel.drvPath
